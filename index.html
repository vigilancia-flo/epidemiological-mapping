<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGEP</title>
    <link
      rel="shortcut icon"
      href="src/assets/Logov1.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- 🆕 Container fixo que vai segurar o VLibras -->
    <div
      id="vlibras-anchor"
      style="
        position: fixed;
        top: 50%;
        right: 23px;
        transform: translateY(-170%);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
      "
    ></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (() => {
        const MOBILE_BREAKPOINT = "(max-width: 767px)";
        const isMobile = window.matchMedia(MOBILE_BREAKPOINT).matches;
        if (isMobile) return;

        // UserWay
        const userwayScript = document.createElement("script");
        userwayScript.src = "https://cdn.userway.org/widget.js";
        userwayScript.setAttribute("data-account", "ZGKiuLM2Nr");
        document.body.appendChild(userwayScript);

        // VLibras
        const vlibrasScript = document.createElement("script");
        vlibrasScript.src = "https://vlibras.gov.br/app/vlibras-plugin.js";
        vlibrasScript.async = true;
        vlibrasScript.onload = () => {
          // Fica observando quando o VLibras for injetado no DOM
          const observer = new MutationObserver(() => {
            const wrapper = document.getElementById("vlibras-access-wrapper");
            const anchor = document.getElementById("vlibras-anchor");

            if (wrapper && anchor) {
              if (wrapper.parentNode !== anchor) {
                anchor.appendChild(wrapper);
              }

              wrapper.style.setProperty("position", "relative", "important");
              wrapper.style.setProperty("top", "auto", "important");
              wrapper.style.setProperty("bottom", "auto", "important");
              wrapper.style.setProperty("left", "auto", "important");
              wrapper.style.setProperty("right", "auto", "important");
              wrapper.style.setProperty("transform", "none", "important");
              wrapper.style.setProperty("margin", "0", "important");
              wrapper.style.setProperty("pointer-events", "auto", "important");

              const accessButton =
                wrapper.shadowRoot?.getElementById("vlibras-access");
              if (accessButton) {
                accessButton.style.setProperty(
                  "position",
                  "relative",
                  "important",
                );
                accessButton.style.setProperty("top", "auto", "important");
                accessButton.style.setProperty("bottom", "auto", "important");
                accessButton.style.setProperty("left", "auto", "important");
                accessButton.style.setProperty("right", "auto", "important");
                accessButton.style.setProperty(
                  "transform",
                  "none",
                  "important",
                );
                accessButton.style.setProperty("margin", "0", "important");
              }

              observer.disconnect();
            }
          });

          observer.observe(document.body, { childList: true, subtree: true });
        };
        document.body.appendChild(vlibrasScript);
      })();
    </script>
  </body>
</html>
